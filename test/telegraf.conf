# Telegraf configuration that runs the plugin through execd exactly as in
# production, but writes the metrics to stdout instead of InfluxDB.
#
# Run from the repository root after building the binary:
#
#   telegraf --config test/telegraf.conf
#
# On Windows change the command to "./mqtt_consumer_db.exe".

[agent]
  interval = "10s"
  flush_interval = "5s"
  ## Plugin log lines (topic list, listener, connection state) arrive on
  ## stderr of the child process and are logged by execd.
  debug = false

[[inputs.execd]]
  command = ["./mqtt_consumer_db", "-config", "test/plugin.local.conf"]
  signal = "none"
  restart_delay = "10s"
  data_format = "influx"
  name_override = "dot"
  tags = {dot = "default_event_log"}

[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"
