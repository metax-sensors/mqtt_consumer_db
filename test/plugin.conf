# Plugin configuration for a test run against the live broker and ACL database.
#
# Copy this file to plugin.local.conf (gitignored), fill in the values marked
# CHANGE_ME from the production plugin.conf, and point the binary at the copy:
#
#   ./mqtt_consumer_db -config test/plugin.local.conf
#
# Use a client_id that is NOT the production one. The broker drops an existing
# session when a second client connects with the same ID, so the production
# instance would be kicked. See README.md for how to create a test ACL row.

[[inputs.mqtt_consumer_db]]
  db_server = "CHANGE_ME:5432"
  db_name = "CHANGE_ME"
  db_username = "CHANGE_ME"
  db_password = "CHANGE_ME"
  server_id = "test"

  ## Log topic lists, listener activity and every forwarded metric. Verbose.
  debug = true

  ## "json_v2" for JSON payloads with the object config below, anything else
  ## (or unset) parses each payload as a single value of data_type.
  data_format = "json_v2"
  # data_type = "float"

  ## Topic patterns to drop from the ACL: "*" one segment, "**" any segments.
  # topic_exclude = ["**/debug"]

  [inputs.mqtt_consumer_db.json_v2]
    [[inputs.mqtt_consumer_db.json_v2.json_v2]]
      measurement_name = "dot"
      [[inputs.mqtt_consumer_db.json_v2.json_v2.object]]
        path = "@this"
        optional = false
        timestamp_key = "ts"
        timestamp_format = "unix_ms"
        timestamp_timezone = "UTC"

  [inputs.mqtt_consumer_db.mqtt_consumer]
    servers = ["ssl://CHANGE_ME:8883"]
    topic_tag = "topic"
    connection_timeout = "30s"

    ## Must exist in vmq_auth_acl with a subscribe_acl. Do not reuse the
    ## production client_id.
    client_id = "server1_readonly_test"
    username = "server1_readonly_test"
    password = "CHANGE_ME"

    ## TLS: take over whatever production uses.
    # tls_ca = "/etc/telegraf/ca.pem"
    # insecure_skip_verify = false

    ## Upper bound for paho's reconnect backoff after a broker restart.
    max_reconnect_interval = "30s"
